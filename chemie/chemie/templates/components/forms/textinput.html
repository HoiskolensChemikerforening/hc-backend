<div class="input-field">
    {{ bound_field }}

    <label for="{{ bound_field.id_for_label }}"
           {% if field.value %}class="active"{% endif %}>
        {{ bound_field.label }}
    </label>

    {% for error in bound_field.errors %}
    <span class="helper-text red-text">{{ error }}</span>
    {% endfor %}


</div>
