
{% load chemie_forms %}

{% with icon=bound_field|field_icon %}

<div class="input-field">
    {% if icon %}
            <i class="material-icons prefix">{{ icon }}</i>
    {% endif %}


    {{ bound_field }}

    <label for="{{ bound_field.id_for_label }}"
           {% if field.value %}class="active"{% endif %}>
        {{ bound_field.label }}
    </label>

    {{ bound_field.errors }}
</div>

{% endwith %}
